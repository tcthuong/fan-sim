base_case: data/base_case
case_matrix:
  rpm: [1, 300, 600, 800, 1000, 1200]
  outlet_pressure: [0, 20, 40, 60]
openfoam:
  shell: bash
  solver: simpleFoam
  latest_time: true
  run_block_mesh: false
  run_surface_feature_extract: false
  run_snappy_hex_mesh: false
  run_check_mesh: false
fields:
  velocity: U
  pressure: p
model:
  backend: physicsnemo
  output_dir: artifacts/models/fan_mgn
omniverse:
  kit_cae_root: D:/nvidia/kit-cae
  export_point_data: true
  export_volume_vdb: optional
