base_case: data/base_case
case_matrix:
  rpm: [60, 120, 240, 360, 500, 650, 800, 1000, 1200, 1500]
  outlet_pressure: [0]
openfoam:
  shell: bash
  solver: simpleFoam
  latest_time: true
  run_block_mesh: false
  run_surface_feature_extract: false
  run_snappy_hex_mesh: false
  run_check_mesh: false
fields:
  velocity: U
  pressure: p
model:
  backend: physicsnemo
  output_dir: artifacts/models/fan_mgn_colab_a100
  processor_size: 3
  hidden_dim: 32
  max_nodes_per_graph: 100000
  sample_seed: 42
omniverse:
  kit_cae_root: /content/kit-cae
  export_point_data: true
  export_volume_vdb: optional
