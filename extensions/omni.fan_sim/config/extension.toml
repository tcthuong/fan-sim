[package]
version = "0.1.0"
category = "CAE"
title = "Fan-Sim"
description = "Calls the Fan-Sim local inference service and loads prediction artifacts into Omniverse."

[dependencies]
"omni.kit.uiapp" = {}
"omni.kit.commands" = {}
"omni.usd" = {}
"omni.cae.schema" = {}
"omni.cae.data" = {}
"omni.cae.viz" = {}
"omni.cae.importer.vtk" = {}
"omni.cae.flow" = {}
"omni.flowusd" = {}

[[python.module]]
name = "omni.fan_sim"

[settings]
# Required for large OpenFOAM VTU files. The fallback VTK delegate can import
# metadata, but later CAE operators may fail when fetching deferred point arrays.
exts."omni.cae.delegate.vtk".useCustomVtuReader = true
